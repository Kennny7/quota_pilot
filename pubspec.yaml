name: quota_pilot
description: Track API quota across AI services from one place.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Storage
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2

  # Networking
  dio: ^5.5.0

  # UI / utilities
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  fl_chart: ^0.68.0
  package_info_plus: ^8.0.0

  cupertino_icons: ^1.0.6

  shared_preferences: ^2.2.3
  
  workmanager: ^0.5.2

  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4     

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/